services:
  # Backend service
  - type: web
    name: pharma-sales-backend
    runtime: node
    repo: # This will be your GitHub repo URL
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # You'll set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render will generate a secure random value
      - key: PORT
        value: 10000 # Render uses port 10000 by default
    healthCheckPath: /
    region: oregon # You can change this to your preferred region

  # Frontend service
  - type: web
    name: pharma-sales-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false # You'll set this after backend is deployed
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html